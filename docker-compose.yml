version: "3.8"
services:

  errandler-express:
    build: ./
    container_name: errandler-express
    volumes:
      - ./:/usr/src/app
      - errandler-express_node_modules:/usr/src/app/node_modules


volumes:
  errandler-express_node_modules:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/node_modules